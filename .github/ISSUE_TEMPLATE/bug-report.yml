name: Bug report
description: Something on the site is broken or looks wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: ["Safari (Mac)", "Safari (iPhone or iPad)", "Chrome", "Firefox", "Edge", "Other"]
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: ["Light", "Dark", "Not sure"]
