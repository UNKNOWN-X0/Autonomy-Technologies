name: Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (lab physics, challenges, progress rules)
        run: node --test tests/*.test.js
      - name: Page checker (guides with their labs, worked solutions, appendices)
        run: python3 -I tools/check-guide.py $(git ls-files 'mei/*.html' 'apdr/*.html' 'eei/*.html' | grep -v -- '-lab.html')
